<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Subcompactions sidestep the watermark</title>
<desc>One logical compaction over the live set L0 three through L0 six. A vertical dashed split at key k divides the work into sub-range A covering keys below k on core one and sub-range B covering keys at or above k on core two, each producing its own output. Both feed a single manifest commit that advances the cursor exactly once over the whole consumed set, so the single-cursor invariant holds.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A7C080" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { fill: #D3C6AA; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.td { fill: #859289; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.tg { fill: #A7C080; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 13px; font-weight: 500; }
.ts { font-size: 11px; }
.mono { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.live { fill: none; stroke: #859289; stroke-width: 1; }
.box { fill: none; stroke: #859289; stroke-width: 1; }
.commit { fill: none; stroke: #A7C080; stroke-width: 1; }
.line { stroke: #859289; stroke-width: 1; fill: none; }
.line-dim { stroke: #5C6A72; stroke-width: 1; fill: none; }
.line-green { stroke: #A7C080; stroke-width: 1; fill: none; }
.split { stroke: #859289; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
</style>
</defs>

<text x="40" y="36" class="td ts">One logical compaction over the live set { L0&#8323; &#8230; L0&#8326; }</text>

<rect x="236" y="52" width="392" height="58" rx="2" fill="none" stroke="#859289" stroke-width="1" stroke-dasharray="0"/>
<rect x="248" y="60" width="84" height="42" rx="2" class="live"/>
<text x="290" y="83" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8323;</text>
<rect x="340" y="60" width="84" height="42" rx="2" class="live"/>
<text x="382" y="83" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8324;</text>
<rect x="442" y="60" width="84" height="42" rx="2" class="live"/>
<text x="484" y="83" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8325;</text>
<rect x="534" y="60" width="84" height="42" rx="2" class="live"/>
<text x="576" y="83" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8326;</text>


<path d="M330 110 C 300 126, 270 138, 240 156" class="line" marker-end="url(#arrow)"/>
<rect x="70" y="162" width="280" height="56" rx="2" class="box"/>
<text x="210" y="184" text-anchor="middle" dominant-baseline="central" class="t th">sub-range A: core 1</text>
<text x="210" y="203" text-anchor="middle" dominant-baseline="central" class="td mono ts">keys (&#8722;&#8734;, k)</text>

<path d="M520 110 C 560 126, 600 138, 610 156" class="line" marker-end="url(#arrow)"/>
<rect x="430" y="162" width="180" height="56" rx="2" class="box"/>
<text x="520" y="184" text-anchor="middle" dominant-baseline="central" class="t th">sub-range B: core 2</text>
<text x="520" y="203" text-anchor="middle" dominant-baseline="central" class="td mono ts">keys [k, +&#8734;)</text>

<text x="210" y="238" text-anchor="middle" class="td ts">output SST(s) for A</text>
<text x="520" y="238" text-anchor="middle" class="td ts">output SST(s) for B</text>

<path d="M210 252 C 210 272, 330 276, 360 286" class="line-green"/>
<path d="M520 252 C 520 272, 400 276, 372 286" class="line-green" marker-end="url(#arrow-green)"/>

<rect x="196" y="290" width="288" height="50" rx="2" class="commit"/>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" class="t th">single manifest commit</text>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" class="td mono ts">advance cursor once: before L0&#8323; &#8594; after L0&#8326;</text>
</svg>
