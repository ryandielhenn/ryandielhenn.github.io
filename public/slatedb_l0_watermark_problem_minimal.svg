<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The L0 compaction watermark is one cursor</title>
<desc>A segment's L0 list as six ordered SST blocks, oldest on the left. A single cursor named last_compacted_l0_sst_view_id sits between L0 two and L0 three; blocks at or below it are faded as consumed, blocks above are solid as live. Two compaction jobs want to consume disjoint subsets and both try to advance the single cursor to different positions, which conflicts.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#E67E80" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { fill: #D3C6AA; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.td { fill: #859289; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.tr { fill: #E67E80; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 13px; font-weight: 500; }
.ts { font-size: 11px; }
.mono { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.live { fill: none; stroke: #859289; stroke-width: 1; }
.consumed { fill: none; stroke: #5C6A72; stroke-width: 1; }
.box { fill: none; stroke: #859289; stroke-width: 1; }
.line { stroke: #859289; stroke-width: 1; fill: none; }
.line-dim { stroke: #5C6A72; stroke-width: 1; fill: none; }
.line-red { stroke: #E67E80; stroke-width: 1; fill: none; }
</style>
</defs>

<text x="40" y="36" class="td ts">segment L0 list</text>
<text x="640" y="36" text-anchor="end" class="td ts">oldest &#8594; newest</text>

<rect x="60" y="48" width="86" height="50" rx="2" class="consumed"/>
<text x="103" y="77" text-anchor="middle" dominant-baseline="central" class="td mono ts">L0&#8321;</text>
<rect x="154" y="48" width="86" height="50" rx="2" class="consumed"/>
<text x="197" y="77" text-anchor="middle" dominant-baseline="central" class="td mono ts">L0&#8322;</text>
<rect x="248" y="48" width="86" height="50" rx="2" class="live"/>
<text x="291" y="77" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8323;</text>
<rect x="342" y="48" width="86" height="50" rx="2" class="live"/>
<text x="385" y="77" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8324;</text>
<rect x="436" y="48" width="86" height="50" rx="2" class="live"/>
<text x="479" y="77" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8325;</text>
<rect x="530" y="48" width="86" height="50" rx="2" class="live"/>
<text x="573" y="77" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8326;</text>

<line x1="244" y1="36" x2="244" y2="112" class="line"/>
<path d="M244 112 l-5 -8 l10 0 z" fill="#859289"/>
<text x="244" y="128" text-anchor="middle" class="td mono ts">last_compacted_l0_sst_view_id</text>

<text x="60" y="148" class="td ts">at/below cursor = consumed   &#183;   above = live</text>

<path d="M338 206 C 380 170, 430 140, 428 112" class="line-dim" marker-end="url(#arrow)"/>
<text x="348" y="184" text-anchor="end" class="td ts">&#8594; cursor after L0&#8324;</text>

<path d="M526 206 C 568 170, 618 140, 616 112" class="line-red" marker-end="url(#arrow-red)"/>
<text x="535" y="184" text-anchor="end" class="tr ts">&#8594; cursor after L0&#8326;</text>

<rect x="248" y="206" width="180" height="46" rx="2" class="box"/>
<text x="338" y="224" text-anchor="middle" dominant-baseline="central" class="t th">Job A</text>
<text x="338" y="241" text-anchor="middle" dominant-baseline="central" class="td mono ts">consume {L0&#8323;, L0&#8324;}</text>
<text x="250" y="265" dominant-baseline="central" class="tr th">Job A still running -></text>
<text x="250" y="280" dominant-baseline="central" class="tr th">B finishes</text>

<rect x="436" y="206" width="180" height="46" rx="2" class="box"/>
<text x="526" y="224" text-anchor="middle" dominant-baseline="central" class="t th">Job B</text>
<text x="526" y="241" text-anchor="middle" dominant-baseline="central" class="td mono ts">consume {L0&#8325;, L0&#8326;}</text>

<text x="440" y="265" dominant-baseline="central" class="tr th">cursor advances to L0&#8326; -></text>
<text x="440" y="280" dominant-baseline="central" class="tr th">{L0&#8323;, L0&#8324;} GCd prematurely</text>
</svg>
