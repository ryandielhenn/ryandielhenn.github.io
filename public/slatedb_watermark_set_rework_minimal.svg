<svg width="100%" viewBox="0 0 680 250" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Track a set of consumed L0 SST ids</title>
<desc>The same six-block L0 list, but instead of a single cursor each SST carries its own consumed flag shown as a dot. An explicit consumed set holds L0 one and L0 two. Job A marks L0 three and L0 four consumed while Job B marks L0 five and L0 six, as two independent disjoint operations with no conflict.</desc>
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A7C080" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { fill: #D3C6AA; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.td { fill: #859289; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.tg { fill: #A7C080; font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 13px; font-weight: 500; }
.ts { font-size: 11px; }
.mono { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
.live { fill: none; stroke: #859289; stroke-width: 1; }
.consumed { fill: none; stroke: #5C6A72; stroke-width: 1; }
.box { fill: none; stroke: #859289; stroke-width: 1; }
.line-dim { stroke: #5C6A72; stroke-width: 1; fill: none; }
.line-green { stroke: #A7C080; stroke-width: 1; fill: none; }
.dot-on { fill: #A7C080; }
.dot-off { fill: none; stroke: #A7C080; stroke-width: 1; }
</style>
</defs>

<text x="40" y="36" class="td ts">segment L0 list</text>
<text x="640" y="36" text-anchor="end" class="td ts">oldest &#8594; newest</text>

<rect x="60" y="48" width="86" height="56" rx="2" class="consumed"/>
<text x="103" y="74" text-anchor="middle" dominant-baseline="central" class="td mono ts">L0&#8321;</text>
<circle cx="103" cy="90" r="6" class="dot-on"/>
<rect x="154" y="48" width="86" height="56" rx="2" class="consumed"/>
<text x="197" y="74" text-anchor="middle" dominant-baseline="central" class="td mono ts">L0&#8322;</text>
<circle cx="197" cy="90" r="6" class="dot-on"/>
<rect x="248" y="48" width="86" height="56" rx="2" class="live"/>
<text x="291" y="74" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8323;</text>
<circle cx="291" cy="90" r="6" class="dot-off"/>
<rect x="342" y="48" width="86" height="56" rx="2" class="live"/>
<text x="385" y="74" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8324;</text>
<circle cx="385" cy="90" r="6" class="dot-off"/>
<rect x="436" y="48" width="86" height="56" rx="2" class="live"/>
<text x="479" y="74" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8325;</text>
<circle cx="479" cy="90" r="6" class="dot-off"/>
<rect x="530" y="48" width="86" height="56" rx="2" class="live"/>
<text x="573" y="74" text-anchor="middle" dominant-baseline="central" class="t mono ts">L0&#8326;</text>
<circle cx="573" cy="90" r="6" class="dot-off"/>

<circle cx="66" cy="126" r="5" class="dot-on"/>
<text x="78" y="130" class="td ts">consumed</text>
<circle cx="158" cy="126" r="5" class="dot-off"/>
<text x="170" y="130" class="td ts">live</text>
<text x="616" y="130" text-anchor="end" class="t mono ts">consumed = { L0&#8321;, L0&#8322; }</text>

<rect x="248" y="158" width="180" height="46" rx="2" class="box"/>
<text x="338" y="176" text-anchor="middle" dominant-baseline="central" class="t th">Job A</text>
<text x="338" y="193" text-anchor="middle" dominant-baseline="central" class="td mono ts">mark {L0&#8323;, L0&#8324;}</text>
<path d="M291 158 L291 110" class="line-green" marker-end="url(#arrow-green)"/>
<path d="M385 158 L385 110" class="line-green" marker-end="url(#arrow-green)"/>

<rect x="436" y="158" width="180" height="46" rx="2" class="box"/>
<text x="526" y="176" text-anchor="middle" dominant-baseline="central" class="t th">Job B</text>
<text x="526" y="193" text-anchor="middle" dominant-baseline="central" class="td mono ts">mark {L0&#8325;, L0&#8326;}</text>
<path d="M479 158 L479 110" class="line-green" marker-end="url(#arrow-green)"/>
<path d="M573 158 L573 110" class="line-green" marker-end="url(#arrow-green)"/>

<text x="338" y="228" text-anchor="middle" class="tg ts">independent</text>
<text x="526" y="228" text-anchor="middle" class="tg ts">independent</text>

</svg>
